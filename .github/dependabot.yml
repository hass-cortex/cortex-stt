version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    # Wait N days after a release before opening a PR — avoid 0-day regressions
    cooldown:
      default-days: 7
      semver-major-days: 30
    # Major bumps only; minor and patch releases are not worth a PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    cooldown:
      default-days: 7
    # Major bumps only; minor and patch releases of an action are not worth a PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      actions:
        patterns: ["*"]
